name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle 8.9 — no wrapper is committed to this repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # SERVER_URL comes from the repo's `SERVER_URL` Actions variable; falls
      # back to the placeholder baked into android/app/build.gradle.kts.
      - name: Build debug APK
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
