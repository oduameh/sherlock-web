name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies (hash-pinned lock)
        # requirements-ci.lock = requirements.txt + dev + stealth, every wheel
        # sha256-pinned: pip refuses anything that does not match (target
        # architecture §8 decision 10). The stealth extra is installed because
        # two tests exercise Scrapling's HTML parser (no browser needed, so no
        # `patchright install`).
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock

      - name: Locks cover requirements*.txt
        run: python scripts/lockcheck.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Frontend syntax (node --check)
        run: node --check static/js/app.js

      - name: Tests (pytest)
        run: pytest -q

      - name: Dependency audit (pip-audit)
        # Blocking: the environment is exactly the lock, so a known
        # vulnerability in any pinned release fails the build until the lock
        # is regenerated with a fixed version (or the finding is triaged with
        # --ignore-vuln and a comment here).
        run: pip-audit --strict --progress-spinner off

      - name: Boot smoke test (/, /api/sites return 200)
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/sites >/dev/null; then break; fi
            sleep 1
          done
          sites=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/sites)
          root=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          echo "GET /api/sites -> $sites"
          echo "GET / -> $root"
          test "$sites" = "200"
          test "$root" = "200"

  postgres:
    # Boot + a persistence check against real Postgres (the production backend).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sherlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/sherlock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies (hash-pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Boot + persistence check against Postgres
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/sites >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/sites)" = "200"
          inv=$(curl -s -X POST http://127.0.0.1:8000/api/investigate \
                -H 'Content-Type: application/json' -d '{"usernames":"octocat"}')
          echo "create investigation -> $inv"
          echo "$inv" | grep -q investigation_id
          # a fresh connection must still see the row (simulates a redeploy)
          python -c "import dbconn; c=dbconn.connect(); n=c.execute('SELECT COUNT(*) FROM investigations').fetchone()[0]; print('investigations persisted:', n); assert n >= 1"
